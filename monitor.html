<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JVS监控</title>
<style>
:root{--bg:#0a0b10;--card:#13151e;--card2:#1a1d2b;--bdr:#232639;--ac:#7c6cff;--ac2:#00e0b8;--t:#e8e8ed;--dim:#8b8fa3;--mu:#5c5f73;--g:#22c55e;--y:#eab308;--r:#ef4444;--bl:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);line-height:1.55}
.w{max-width:1440px;margin:0 auto;padding:24px 28px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--bdr);margin-bottom:28px}
header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#7c6cff,#00e0b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px}
header h1 i{font-style:normal;font-size:32px;-webkit-text-fill-color:initial}
.hr{display:flex;align-items:center;gap:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);animation:p 2s infinite;display:inline-block}
@keyframes p{0%,100%{opacity:1}50%{opacity:.45}}
.bdg{font-size:12px;color:var(--dim);background:var(--card);padding:5px 13px;border-radius:16px;border:1px solid var(--bdr)}
.g{display:grid;gap:14px;margin-bottom:28px}
.g4{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.c{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:18px 20px;transition:.2s}
.c:hover{border-color:#353850;background:var(--card2)}
.ct{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.cv{font-size:22px;font-weight:800}
.cs{font-size:11.5px;color:var(--mu);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{height:7px;background:var(--bdr);border-radius:4px;overflow:hidden;margin-top:8px}
.pf{height:100%;border-radius:4px}
.pl{background:var(--g)}.pm{background:var(--y)}.ph{background:var(--r)}
.tg{display:inline-flex;align-items:center;padding:2px 9px;border-radius:14px;font-size:10.5px;font-weight:700;gap:3px}
.tg-g{background:rgba(34,197,94,.13);color:var(--g)}.tg-y{background:rgba(234,179,8,.13);color:var(--y)}
.tg-r{background:rgba(239,68,68,.13);color:var(--r)}.tg-b{background:rgba(59,130,246,.13);color:var(--bl)}
.tg-a{background:rgba(124,108,255,.13);color:var(--ac)}.tg-a2{background:rgba(0,224,184,.13);color:var(--ac2)}
.sec{margin-bottom:30px}
.st{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.st i{font-style:normal;font-size:20px}
.sk-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sk-c{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:12px 15px;transition:.2s}
.sk-c:hover{border-color:var(--ac);transform:translateY(-1px)}
.sk-n{font-weight:700;font-size:13.5px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.sk-d{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.tl-c{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:11px 13px;transition:.2s}
.tl-c:hover{border-color:var(--ac2)}
.tl-n{font-weight:700;font-size:12.5px;color:var(--ac2);font-family:'SF Mono','Fira Code',monospace;margin-bottom:3px}
.tl-d{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-c{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:14px 18px;margin-bottom:10px}
.cr-n{font-weight:700;font-size:14px;margin-bottom:6px}
.cr-d{font-size:11.5px;color:var(--dim);margin-bottom:3px}
.sg{display:flex;gap:14px;flex-wrap:wrap}
.si{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--card);border:1px solid var(--bdr);border-radius:10px;min-width:130px}
.sc{font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bdr);background:var(--card2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--bdr);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:768px){.g4,.g3{grid-template-columns:1fr}.w{padding:14px}header{flex-direction:column;gap:10px;align-items:flex-start}}
</style>
</head>
